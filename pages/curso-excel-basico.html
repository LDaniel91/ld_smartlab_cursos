<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso Excel Básico - LD SmartLab</title>
    <link rel="stylesheet" href="../css/presentation.css">
    <style>
        :root {
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --accent-color: #2ecc71;
            --accent-hover: #27ae60;
        }
    </style>
</head>
<body>
    <div class="presentation-container" id="app">
        <div class="course-selector" id="courseSelector" hidden></div>

        <div class="header">
            <h1 id="mainTitle"></h1>
            <div>
                <span class="badge badge-basico" id="badgeLevel"></span>
                <span class="slide-counter" id="slideCounter"></span>
            </div>
        </div>

        <div class="slide-content" id="slideContent"></div>

        <div class="navigation">
            <div class="nav-buttons">
                <button id="prevBtn">◀ Anterior</button>
                <button id="nextBtn" class="primary">Siguiente ▶</button>
            </div>
            <div class="nav-buttons">
                <button id="indexBtn" class="index-btn">📋 Índice</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="indexModal">
        <div class="modal-box">
            <h3 id="modalTitle">📋 Índice</h3>
            <div id="indexList"></div>
            <button class="close-modal" id="closeModalBtn">Cerrar</button>
        </div>
    </div>

    <script src="../js/data/excel-basico.js"></script>
    <script src="../js/presentation-engine.js"></script>
    <script>
        PresentationEngine.init({
            title: 'Excel Básico',
            emoji: '📗',
            levels: {
                basico: { label: 'Básico', emoji: '📗', slides: CURSO_EXCEL_BASICO }
            }
        });
    </script>
</body>
</html>
